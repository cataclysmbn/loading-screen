name: check

on:
  pull_request: { paths: ["data/**"] }

permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true, fetch-depth: 2 }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: git diff -z --name-only --diff-filter=AMR HEAD^1 HEAD -- data | xargs -0 -r uv run scripts/loading_screen.py check
