name: release

on:
  push: { branches: [main], paths: ["data/**", "scripts/loading_screen.py"] }
  workflow_dispatch:

permissions: { contents: write }

concurrency: { group: release }

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }
      - run: |
          tar -czf loading-screens.tar.gz data
          git tag -f release && git push -f origin release
          gh release view release >/dev/null 2>&1 || gh release create release --title release --notes ""
          gh release edit release --title "Release $(date -u '+%F %H:%M')" --notes "data/ from $(git rev-parse --short HEAD)"
          gh release upload release loading-screens.tar.gz --clobber
        env: { GH_TOKEN: "${{ github.token }}" }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: |
          uv run scripts/loading_screen.py collage "$RUNNER_TEMP/collage.webp"
          git switch --orphan assets
          cp "$RUNNER_TEMP/collage.webp" collage.webp
          git add collage.webp
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "chore: update collage"
          git push -f origin assets
