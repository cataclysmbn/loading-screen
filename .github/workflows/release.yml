name: release

on:
  push: { branches: [main], paths: ["data/**", "scripts/loading_screen.py"] }
  workflow_dispatch:

permissions: { contents: write }

concurrency: { group: release }

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true, fetch-depth: 0 }
      - run: |
          tar -czf loading-screens.tar.gz data
          sha=$(git rev-parse --short HEAD)
          git tag -f experimental && git push -f origin experimental
          gh release view experimental >/dev/null 2>&1 || gh release create experimental --title experimental --notes ""
          gh release edit experimental --title "Experimental @ $(date -u '+%F %T') ($sha)" --notes "data/ from $sha"
          gh release upload experimental loading-screens.tar.gz --clobber
          today=$(date -u +%F)
          last=$(git tag -l '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]' | sort | tail -1)
          if [ -z "$last" ] || [ "$last" = "$today" ] || [ "$(git rev-parse "$last:data")" != "$(git rev-parse HEAD:data)" ]; then
            git tag -f "$today" && git push -f origin "$today"
            gh release view "$today" >/dev/null 2>&1 || gh release create "$today" --prerelease --title "Nightly $today" --notes "data/ on $today"
            gh release upload "$today" loading-screens.tar.gz --clobber
          fi
        env: { GH_TOKEN: "${{ github.token }}" }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: |
          uv run scripts/loading_screen.py collage "$RUNNER_TEMP/collage.webp"
          git switch --orphan assets
          cp "$RUNNER_TEMP/collage.webp" collage.webp
          git add collage.webp
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "chore: update collage"
          git push -f origin assets
          curl -sS "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@assets/collage.webp"
