name: Loading screen
description: Submit a loading screen image.
title: "Loading screen: "
labels: [loading screen]
body:
  - type: input
    id: artist
    attributes:
      label: Artist
      description: Name to show in game.
    validations: { required: true }
  - type: input
    id: image-title
    attributes: { label: Title }
    validations: { required: true }
  - type: dropdown
    id: target
    attributes:
      label: Target
      description: Use core for base game, or pick a mod if image should only show with that mod.
      options: [core, My_Sweet_Cataclysm, classic_zombies, innawoods, Other]
    validations: { required: true }
  - type: input
    id: mod
    attributes:
      label: Other mod
      description: Mod folder name in data/mods/, if you picked Other.
  - type: checkboxes
    id: pixel-art
    attributes:
      label: Pixel art
      options:
        - label: This is a pixel art
  - type: textarea
    id: image
    attributes:
      label: Image
      description: "Only paste single image, 10MiB or less. Note: image will be converted into webp (≤128KiB)"
    validations: { required: true }
  - type: input
    id: coauthor
    attributes:
      label: Co-author
      description: Submitting for someone else? Put their GitHub username here.
  - type: checkboxes
    id: rights
    attributes:
      label: Checklist
      description: We try to be careful with copyright issues.
      options:
        - label: I made this image, or its artist allowed us to use it as a loading screen.
          required: true
        - label: No part is traced or copied from other works (movies, games, photos).
          required: true
        - label: Not AI-generated.
          required: true
        - label: Safe for work.
          required: true
