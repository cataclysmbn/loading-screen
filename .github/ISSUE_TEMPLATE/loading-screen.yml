name: Loading screen
description: Submit a loading screen image.
title: "Loading screen: "
labels: [loading screen]
body:
  - type: input
    id: artist
    attributes:
      label: Artist
      description: Name to show in game.
    validations: { required: true }
  - type: input
    id: image-title
    attributes: { label: Title }
    validations: { required: true }
  - type: dropdown
    id: target
    attributes:
      label: Target
      description: Pick core for base game. Pick a mod to show image only with that mod.
      options: [core, My_Sweet_Cataclysm, classic_zombies, innawoods, Other]
    validations: { required: true }
  - type: input
    id: mod
    attributes:
      label: Other mod
      description: If you picked Other, type the mod's folder name in data/mods/.
  - type: checkboxes
    id: pixel-art
    attributes:
      label: Pixel art
      options:
        - label: Keep pixels sharp. Output is lossless WebP, shrunk only by whole factors (1/2, 1/3).
  - type: textarea
    id: image
    attributes:
      label: Image
      description: Drag one image here, 10 MiB or less. Output is WebP, 128 KiB or less.
    validations: { required: true }
  - type: input
    id: coauthor
    attributes:
      label: Co-author
      description: If you submit for someone else, type their GitHub username to credit them in the commit.
  - type: checkboxes
    id: rights
    attributes:
      label: Checklist
      description: We try to be careful with copyright issues.
      options:
        - label: I made this image, or its artist allowed us to use it as a loading screen.
          required: true
        - label: No part is traced or copied from other works (movies, games, photos).
          required: true
        - label: Not AI-generated.
          required: true
        - label: Safe for work.
          required: true
